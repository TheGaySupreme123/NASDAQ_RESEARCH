a member of the Audit, Compensation and Governance committees of a $250M SPAC Soulpower Acquisition Corporation (NYSE: SOUL) and one of the few members of the National War College Alumni Association from the private sector where he serves as a NATSEC Fellow. Mr. Janover is a Harvard Business School alumnus via its OPM program, is an active member of YPO where he serves on the chapter board, has been an Official Member of the Forbes Real Estate Council, an On Deck Proptech and Scale Fellow, and an Entrepreneur in Residence and guest lecturer at Florida Atlantic University as well as at the Zell Entrepreneurship program in Israel. Mr. Janover has been featured in Forbes, Bloomberg, and spoken at the National Defense University on subjects ranging from artificial intelligence to real estate finance. He has been involved in billions of dollars of capital markets transactions over the course of his career.1a:T97b,Hadley Stern has worked in crypto assets and blockchain—across institutions, startups, and scaleups—since 2014. He served as SVP of Fidelity Labs beginning in 2007, where he led design, development, and product management teams researching and piloting emerging technologies for Fidelity’s business units. His work spanned wearable computing, VR/AR, mobile applications (including Fidelity’s first mobile app and mobile brokerage), and early AI initiatives. In 2014, recognizing the growing relevance of blockchain and digital assets to global finance, Stern was asked by senior leadership to establish and lead Fidelity’s Bitcoin Incubator, marking the start of his focused work in crypto assets. As SVP of the newly created Bitcoin Incubator, Stern helped develop Fidelity’s earliest digital asset initiatives, including enabling bitcoin donations to Fidelity Charitable and launching the firm’s first bitcoin mining operation. These efforts positioned Fidelity as one of the first major financial institutions to engage meaningfully with crypto and led to Stern joining the founding team of Fidelity Digital Asset Services in 2016, where he helped bring institutional-grade digital asset trading, custody, and related services to market. In 2018, Stern moved to the DeFi and startup side of the industry as COO of the blockchain infrastructure company Bloq, where he helped significantly grow revenue and expand the enterprise product roadmap. He later led the AWS Innovation Lab, working with global brands on experimentation and deployment across emerging technologies, including AI and quantum computing. From there, he was recruited to lead global digital asset custody at BNY Mellon, where he helped launch the industry’s first bank-grade digital asset custody platform supporting bitcoin and Ethereum. Most recently, Stern served as Chief Commercial Officer at Marinade Finance, one of the leading staking protocols in the Solana ecosystem. In that role, he led institutional strategy, partnerships, and go-to-market efforts, working closely with asset managers, custodians, validators, and infrastructure providers to bring compliant, scalable staking solutions to market. He played a central role in bridging traditional finance and DeFi, helping position Marinade as a trusted staking partner for institutional participants while supporting the decentralization and resilience of the Solana network.1b:T432,At Kraken from 2016 to 2024, most recently as Chief Strategy Officer, joined at 23 headcount, left at around 2300. At Kraken, drove initiatives to increase size of margin pool, fees, and utilization resulting in hundreds of millions in additional annual revenue, oversaw key acquisitions, and served as a \"jack of all trades\" taking on whatever was on fire at the time, managed customer service, account management, institutional business unit, OTC desk, HR, etc basically everything but engin"])</script><script>self.__next_f.push([1,"eering. Became a software developer since leaving Kraken and won the Permissionless III hackathon with a CLOB DEX with 0 dator operations, on-chain innovation, and strategic partnerships to provide market participants with the optimal way to maximize SOL investment returns.\"}},\"team\":{\"description\":\"We are a team of veterans from both crypto and traditional finance who deeply believe in the future of Solana. We believe Solana will become the base layer for global asset trading through its continuously growing developer community, best-in-class transaction speed and lowest costs, and increasingly robust infrastructure decentralization.\"},\"tradfi\":{\"tagline\":{\"prefix\":\"Decades of expertise \",\"highlight1\":\"in traditional finance\",\"comma\":\", with a team that's been \",\"highlight2\":\"in crypto from the beginning\",\"suffix\":\".\"}},\"products\":{\"sectionTitle\":\"Building a stable future for SOL.\",\"dfdvStock\":{\"title\":\"DFDV Stock\",\"nasdaq\":\"NASDAQ Listed\",\"tradedOn\":\"Tradeable through all major U.S. brokerage accounts\",\"brokerageAccounts\":\"\",\"frankfurt\":\"Listed on Frankfurt Stock Exchange\"},\"dfdvx\":{\"title\":{\"line1\":\"DFDVx\",\"line2\":\"Tokenized Equity\"},\"description\":\"Trade tokenized equity through our partners\"},\"dfdvSOL\":{\"title\":\"dfdvSOL LST\",\"description\":{\"main\":\"Explore the potential of the dfdvSOL\",\"tokenLST\":\"Liquid Staking Token (LST)\"}},\"treasuryAccelerator\":{\"title\":{\"line1\":\"DFDV Treasury\",\"line2\":\"Accelerator\"},\"description\":\"Strategic franchise model supporting global Solana asset management\"}},\"allLinks\":{\"buttonText\":\"All Links \u0026 Resources\"},\"resources\":{\"sectionTitle\":\"Want to learn more?\",\"cantor\":{\"title\":\"SOL Treasury Operations Analysis\",\"subtitle\":\"Cantor Fitzgerald — Investment Research\"},\"kishan\":{\"title\":\"August 2025 Report\",\"subtitle\":\"Kishan Shah Research — Investment Research\"}}},\"solModel\":{\"title\":\"How Much Is SOL Actually Worth? A New Way to Think About It\",\"readMemo\":\"Read the Full Memo\",\"downloadModel\":\"Download the DFDV SOL Model\",\"agenticAiModel\":\"Agentic AI Model\",\"paragraph1\":\"Most valuation frameworks for SOL borrow from traditional finance. Analysts take the network’s revenue, assign a multiple, and arrive at a price target. Others run a DCF or apply the monetary equation of exchange (MV=PQ). Each of these approaches has merit, but each also breaks in important ways when applied to a Layer 1 token. For example, SOL holders have no claim on protocol revenue. There are no dividends. Fees accrue to validators, not token holders. The frameworks built for equities and currencies weren’t designed for assets like SOL, and the results tend to reflect that.\",\"paragraph2\":\"In this piece, we introduce a new framework. We call it the DFDV model (Demand-Float Derived Valuation), and it starts with a simple observation: Solana should be valued like a rapidly growing digital city. New participants are arriving constantly: AI agents, DeFi protocols, tokenized assets, retail traders, DePIN networks, and institutional allocators. All of them need SOL to operate within the city. They need it for gas, for staking, for liquidity, for collateral, for settlement. And the amount of SOL that’s actually available to buy in this digital city is remarkably small.\",\"paragraph3\":\"We estimate that approximately 90% of SOL’s supply will be structurally committed in the long term. Stakers hold the bedrock. DeFi protocols occupy the commercial district. Institutions and ETFs have acquired their corporate campuses. Apps have claimed the plumbing. Long term, this leaves roughly 10% of total supply as the genuine free float, the only land in the city actually for sale. Our model then asks: how many dollars are competing for that scarce 10%? We lay out four major sources of demand, each grounded in observable activity and projected forward to maturity. The clearing price between supply and demand i"])</script><script>self.__next_f.push([1,"s the implied value of SOL. In our base case, we arrive at a $10k price target.\",\"paragraph4\":\"We want to be clear about what this model is and what it isn’t. It is a framework, and an imperfect one at that. The assumptions are debatable, the inputs are stress-testable, and we’ve built it that way on purpose. The full spreadsheet is open for anyone to plug in their own numbers and arrive at their own conclusions. Our objective is not to be overly prescriptive or precise. Our goal is to illustrate a simple idea: we believe Solana is heading to trillions of dollars in market cap, and the existing valuation toolkits don’t fully explain why. The DFDV model is our attempt to fill that gap. We hope it’s useful, and we welcome the debate and any feedback you may have.\"},\"tabs\":{\"keyMetrics\":{\"solPerShare\":\"SOL Per Share (SPS)\",\"solPerShareUsd\":\"SOL Per Share (USD)\",\"spsGrowth3M\":\"SPS Growth 3M\",\"solCount\":\"SOL Count\",\"spsGuidance\":\"SPS Guidance\",\"spsMidTermGuidance\":\"SPS Mid Term Guidance\",\"spsLongTermGuidance\":\"SPS Long Term Guidance\",\"spsGrowthToMidTerm\":\"SPS Growth to Mid Term Guidance\",\"dfdvMetrics\":\"DFDV Metrics\",\"dfdvPrice\":\"DFDV Price\",\"marketCap\":\"Market Cap\",\"enterpriseValue\":\"Enterprise Value\",\"sharesOutstanding\":\"Shares Outstanding\",\"sseReturn\":\"SSE Return\",\"threeMonthReturn\":\"3-Month Return\",\"sixMonthReturn\":\"6-Month Return\",\"oneYearReturn\":\"1-Year Return\",\"impliedVolatility\":\"Implied Volatility\",\"historicVolatility\":\"Historic Volatility\",\"tradingVolume\":\"Trading Volume\",\"avgTradingVol30D\":\"Avg. Trading Volume (30D)\",\"solMetrics\":\"SOL Metrics\",\"solPrice\":\"SOL Price\",\"solNav\":\"SOL NAV\",\"mNav\":\"mNAV\",\"solGain3M\":\"SOL (Per Share) 3M Gain\",\"solGain12M\":\"SOL (Per Share) 12M Gain\",\"solGain2025\":\"SOL (Per Share) 2025 Gain\",\"solDollarGain3M\":\"SOL $ (Per Share) 3M Gain\",\"solDollarGain12M\":\"SOL $ (Per Share) 12M Gain\",\"solDollarGain2025\":\"SOL $ (Per Share) 2025 Gain\",\"guidanceDisclaimer\":{ ,\"what-is-warrant-dividend\":{\"term\":\"What is a Warrant Dividend?\",\"definition\":\"A warrant dividend is the distribution of warrants to all existing common shareholders on a pro-rata basis. Like a cash dividend, shareholders do not need to pay any amount or take any action to receive the dividend. In the case of a warrant dividend, the value distributed to all shareholders is in the form of warrants rather than cash.\"}},\"faq\":{\"who-receives-warrants\":{\"question\":\"Who Will Receive the Warrants?\",\"answer\":\"Holders of DFDV common stock as of the record date of October 23, 2025, will receive one warrant for every 10 shares held (fractional warrants are rounded down). For example, a shareholder holding 320 or 327 shares would receive 32 warrants. No fractional warrants will be issued. Holders of the Company's 5.50% Convertible Senior Notes due 2030 as of the record date will also receive warrants on a converted basis per the indenture terms. Noteholders will receive 4.32694 warrants per $1,000 principal amount, rounded down. No fractional warrants will be issued. This warrant distribution does not trigger an additional adjustment to the convertible note conversion ratio.\"},\"distribution-date\":{\"question\":\"When Will the Warrants Be Distributed?\",\"answer\":\"On or about October 27, 2025\"},\"expiration-date\":{\"question\":\"When Is the Expiration Date?\",\"answer\":\"January 21, 2028 (subject to change if the Alternate Expiration Price Condition is met)\"},\"alternate-expiration\":{\"question\":\"What is the Alternate Expiration Price Condition?\",\"answer\":\"If the volume-weighted average price (VWAP) of DFDV common stock is $27.00 or above for at least 20 trading days (not necessarily consecutive) within any 30 consecutive trading day period, the warrants will expire early. Specifically, they will expire at 5:00 PM New York time on the business day immediately following the 20th qualifying day, or such other date as the Company may determine under the warrant agreement. DFDV will issue a press release if the Alternate Expiration Price Condition is met.\"},\"exercise-price\":{\"question\":\"What Is the Exercise Price?\",\"answer\":\"$$22.50 per share\"},\"margin-account\":{\"question\":\"What Happens if I Hold My DFDV Shares in a Margi"])</script><script>self.__next_f.push([1,"n Account and the Shares Are on Loan as of the October 23, 2025 Record Date?\",\"answer\":\"If your DFDV shares are in a margin account, your broker may lend your shares without notifying you. This is standard practice for margin accounts. If your shares are on loan on the record date of the warrant dividend, you may not be considered a shareholder of record for warrant dividend purposes and would not receive warrants directly from DFDV. Your broker may place a 'substitute' entry in your account instead of actual warrants. These substitute warrant entries are not exercisable warrants and cannot be exercised or traded unless your broker takes steps to obtain actual warrants, which is not guaranteed.\"},\"ensure-receive-warrants\":{\"question\":\"How Do I Ensure I Receive the Actual Exercisable DFDV Warrants if I Have a Margin Account?\",\"answer\":\"Before the October 23, 2025 record date, transfer your shares from a margin account to a cash account (or fully paid account), and confirm with your broker that your shares are held in your name and are not subject to lending or rehypothecation. Processing times vary by broker.\"},\"why-issuing\":{\"question\":\"Why Is DFDV Issuing These Warrants?\",\"answer\":\"DFDV believes the warrant dividend is a shareholder-friendly form of capital raising that rewards existing shareholders and noteholders. This allows existing DFDV investors to maintain their ownership percentage and equally participate in the company's future growth, or sell their warrants for cash. We believe the warrants provide an opportunity to raise meaningful capital more cost-effectively than traditional equity offerings. The exercise price reflects our confidence in the company's growth prospects and commitment to efficient capital raising.\"},\"what-to-do\":{\"question\":\"What Do I Have to Do to Receive the Warrants?\",\"answer\":\"If you are a shareholder as of the October 7, 2025 record date and have not lent your shares to a broker or other party, in most cases no action is needed. For details, contact your broker or DeFi Development Corp.'s transfer agent, Colonial Stock Transfer, Inc., Shareholder Services. Email: shareholders@colonialstock.com Phone: (801) 355-5740\"},\"can-sell\":{\"question\":\"Can I Sell My Warrants? Will They Trade Publicly?\",\"answer\":\"Subject to applicable securities laws and Company policies that may apply to insiders, there are no restrictions on buying or selling warrants. We intend to apply for listing of the warrants on the Nasdaq Capital Market, and trading under the ticker DFDVW may begin on the first trading day after the distribution date. After distribution, DFDV shareholders may trade or exercise warrants regardless of whether they continue to hold DFDV common stock.\"},\"trading-begins\":{\"question\":\"When Will the Warrants Begin Trading Separately on Nasdaq?\",\"answer\":\"Warrants are expected to begin trading on Nasdaq under the ticker DFDVW on the first trading day after the distribution date.\"},\"warrant-agreement\":{\"question\":\"Can I Receive a Copy of the Full Warrant Agreement?\",\"answer\":\"Yes. DFDV will file the complete warrant agreement with the SEC on or before the distribution date. It will be available on the SEC's EDGAR system (www.sec.gov) and the DFDV IR page.\"},\"dilution\":{\"question\":\"Will There Be Dilution?\",\"answer\":\"If warrants are not exercised, there is no dilution to DFDV shareholders. We expect all warrants to either expire or be exercised by the January 21, 2028 expiration date. Since warrants are distributed to all DFDV shareholders on a pro-rata basis, if a shareholder retains and exercises their warrants to purchase additional shares, no dilution of their ownership percentage in DFDV common stock is expected. However, if a current DFDV shareholder decides to sell their warrants on the market for cash, they will not be able to exercise them and their ownership percentage may decrease.\"},\"use-of-proceeds\":{\"question\":\"Use of Proceeds from Warrant Exercises\",\"answer\":\"SOL purchases and general working capital\"},\"immediate-proceeds\":{\"question\":\"Does the Company Receive Proceeds Immediately?\",\"an"])</script><script>self.__next_f.push([1,"swer\":\"No. DeFi Development Corp. will not receive any proceeds from this warrant distribution unless holders exercise their warrants before the January 21, 2028 expiration date.\"},\"price-not-up\":{\"question\":\"What Happens if the Stock Price Doesn't Exceed the Exercise Price?\",\"answer\":\"If warrants are not sold or exercised by the January 21, 2028 expiration date (or early expiration date, if applicable), they will expire worthless. You can exercise warrants at the exercise price even if DFDV's market price is below the exercise price, but it may be more advantageous to purchase shares on the open market at the lower price.\"},\"alternate-condition-works\":{\"question\":\"How Does the Alternate Expiration Price Condition Work?\",\"answer\":\"If the Alternate Expiration Price Condition is met, warrants will expire at 5:00 PM New York time on the business day immediately following the Alternate Expiration Price Condition Date (defined below), or such other date as the Company may determine under the warrant agreement. The condition is met when the VWAP of our common stock is at or above $27.00 (the 'Alternate Expiration Trigger Price') for 20 trading days (not necessarily consecutive) within 30 consecutive trading days (the last such day being the 'Alternate Expiration Price Condition Date'). If the condition is triggered, the Company will announce the expiration date. Otherwise, warrants will expire at 5:00 PM New York time on January 21, 2028.\"},\"measurement-period-begins\":{\"question\":\"When Does the 20-of-30 Trading Day VWAP Measurement Period Begin?\",\"answer\":\"The 20-of-30 trading day VWAP measurement period may begin on the first trading day after the distribution date, provided there is an effective shelf registration statement covering shares issuable upon warrant exercise at that time. If our stock trades at or above $27.00 on that day and the VWAP meets the threshold, it could count as the first qualifying day in the 30-trading-day period.\"},\"when-expire-if-condition-met\":{\"question\":\"When Do Warrants Expire If the VWAP Condition is Met on the 20th Qualifying Day?\",\"answer\":\"Warrants expire on the business day immediately following the 20th qualifying trading day within the 30-day period. However, the Company may announce an alternative expiration date under the warrant agreement.\"},\"how-know-expiring\":{\"question\":\"How Will I Know if My Warrants Are About to Expire?\",\"answer\":\"If warrants are set to expire due to the final expiration date or early expiration, the Company will issue a press release announcing the expiration date. This notice will be provided as promptly as possible and will include the exact date and time by which warrant exercises must be completed. Shareholders should monitor the Company's IR website (https://defidevcorp.com/investor) and SEC filings at www.sec.gov.\"},\"when-can-exercise\":{\"question\":\"When Can I Exercise My Warrants?\",\"answer\":\"You may exercise warrants at any time from the distribution date until the expiration date (or an earlier deadline set by your broker). This is subject to certain limited exceptions in the warrant agreement, and requires that the Company has filed and made effective a registration statement including an exercise-related prospectus or prospectus supplement on or before the distribution date.\"},\"how-to-exercise\":{\"question\":\"How Do I Exercise My Warrants?\",\"answer\":\"To exercise warrants, you must have funds available to pay the exercise price in cash. Procedures and processing times vary by broker, so consult with your broker. Your broker may require specific notification methods and may impose deadlines earlier than the expiration date.\"},\"online-brokerage\":{\"question\":\"I Hold DFDV Stock in an Online Brokerage Account. How Do I Receive My Warrants?\",\"answer\":\"If you held shares as of the record date and those shares were not rehypothecated or lent, your broker is generally responsible for crediting warrants to your account. Different procedures may apply if shares were rehypothecated or on loan. In all cases, contact your broker directly for timing and access to warrant"])</script><script>self.__next_f.push([1,"s, including procedures for trading and exercising.\"},\"last-day-to-buy\":{\"question\":\"What is the Last Day to Buy DFDV Stock and Still Receive Warrants?\",\"answer\":\"In most cases, you would need to purchase DFDV shares by the close of trading on October 22, 2025 to receive the warrant dividend. Purchases on or before October 22 will generally settle by the close of business on October 23, 2025, making you eligible for warrants. Purchases on or after October 23 will not be eligible. October 22, 2025 is the expected ex-dividend date.\"},\"how-to-exercise-detailed\":{\"question\":\"How Do I Exercise My Warrants? (Detailed)\",\"answer\":\"You may exercise warrants through your broker if held in street name, or through the warrant agent, Colonial Stock Transfer, Inc., if held as a registered stockholder. Settlement occurs as promptly as commercially practicable after your broker or Colonial processes the exercise. Refer to the warrant agreement filed with the SEC as Form 8-A on or before the distribution date.\"},\"not-multiple-of-10\":{\"question\":\"What if I Don't Hold a Multiple of 10 DFDV Shares?\",\"answer\":\"Warrants are distributed at a rate of 0.1 per share of common stock, rounded down to the nearest whole number. In practice, your broker may round down warrants for each account separately without consolidating multiple accounts. For example, if you hold 19 shares in one account and 14 shares in another at the same broker, you may receive only 1 warrant per account for a total of 2 warrants despite holding 32 shares combined.\"},\"non-us-stockholders\":{\"question\":\"Are Non-US Shareholders Eligible for the Warrant Dividend?\",\"answer\":\"We are not aware of restrictions preventing non-US shareholders from receiving warrants if they hold DFDV common stock as of the record date. Tax treatment may vary depending on the shareholder's tax residence and other factors. Both US and non-US shareholders should consult their tax advisors. Non-US shareholders should contact their broker for jurisdiction-specific procedures.\"},\"retirement-account\":{\"question\":\"How Are Warrants Handled in Retirement Accounts?\",\"answer\":\"If you held shares as of the October 23, 2025 record date, we expect warrants to be credited to retirement accounts in some cases. However, exercising or selling warrants within a retirement account may be subject to additional rules or restrictions. Consult your retirement account broker, advisor, and/or administrator.\"},\"tax-treatment\":{\"question\":\"What is the US Tax Treatment of the Warrant Distribution and/or Exercise?\",\"answer\":\"US federal income tax treatment of the warrant distribution and future warrant exercises may vary depending on the investor's specific circumstances. DeFi Development Corp. does not provide tax advice. All investors, regardless of tax residence, should consult their tax advisor and read the tax reporting section of the prospectus supplement to be filed with the SEC on the distribution date.\"}},\"disclaimers\":{\"title\":\"Disclaimers\",\"forward-looking\":{\"heading\":\"Forward-Looking Statements\",\"content\":\"$1c\"},\"no-offer\":{\"heading\":\"No Offer of Securities\",\"content\":\"$1d\"}},\"metrics\":{\"warrantName\":{\"label\":\"Name\",\"definition\":\"The name of the warrant.\"},\"warrantIssueDate\":{\"label\":\"Issue Date\",\"definition\":\"The date the warrant was issued.\"},\"exercisePrice\":{\"label\":\"Exercise Price\",\"definition\":\"The price at which the warrant can be exercised to purchase shares.\"},\"warrantExpirationDate\":{\"label\":\"Expiration Date\",\"definition\":\"The date on which the warrant expires.\"},\"warrantNotionalAmount\":{\"label\":\"Notional Amount\",\"definition\":\"The notional amount of the warrant.\"},\"numberOfShares\":{\"label\":\"Number of Shares\",\"definition\":\"The number of shares that can be purchased by exercising the warrant.\"}}},\"execComp\":{\"sps\":\"Current SOL per Share (SPS)\",\"compensationTiers\":\"Company-Wide Compensation Tiers\",\"compensationTiersDesc\":\"DeFi Development Corp. has tied all employee compensation to SOL per Share (SPS) growth. As the company achieves higher SPS targets, the performance bonus payout rate increases.\",\"spsTier\":{\"solid"])</script><script>self.__next_f.push([1,"\":\"SOLid Tier\",\"lfg\":\"LFG Tier\",\"wagmi\":\"WAGMI Tier\"},\"spsRange\":\"SPS Range\",\"spsTierDesc\":{\"solid\":\"100% performance bonus payout\",\"lfg\":\"150% performance bonus payout\",\"wagmi\":\"200% performance bonus payout\"},\"note\":\"Note: All employee performance bonuses are tied to SOL per Share performance. If the SOLid tier is not achieved, no performance bonus is paid. The next performance evaluation is scheduled for April 2026.\",\"nextEvaluationDate\":\"April 2026\"},\"stable\":{\"pageTitle\":\"Stablecoin Metrics\"},\"notes\":{\"notesTitle\":\"Notes\",\"glossaryTitle\":\"Glossary\",\"sections\":{\"dashboardInfo\":{\"title\":\"Important Information About This Dashboard\",\"content\":\"Nothing in this material constitutes tax, legal, insurance, or investment advice, nor does it constitute a recommendation or offer to sell securities, or a solicitation of an offer to buy or invest. Past market trends are not reliable indicators of actual future market behavior or future performance of any particular investment, and actual performance may differ materially. All investments involve a degree of risk, and no investment is guaranteed to provide positive performance over any specific period. Different periods and market conditions may produce significantly different results. The products contained in this dashboard are not FDIC insured, may lose value, and are not guaranteed by a bank. Third-party information contained in this dashboard has been obtained from sources believed to be reliable but is not guaranteed.\"},\"solKpis\":{\"title\":\"Important Information About SOL Yield, SOL Gain, and SOL Dollar Gain KPIs\",\"content\":\"$1e\"},\"solNav\":{\"title\":\"Important Information About Solana NAV and mNAV\",\"content\":\"Solana NAV is the total number of Solana held by the Company as of a given date multiplied by the current market price of Solana. It does not consider or include the Company's debt or the liquidation value of preferred stock. Therefore, it is not the same as 'net asset value' or 'NAV' or similar metrics in the traditional finance context. mNAV is a multiple of Solana NAV as of a given date, calculated by dividing the Company's enterprise value by Solana NAV. Investors should rely on the financial statements and other disclosures in the Company's SEC filings.\"},\"marketPrice\":{\"title\":\"Important Information About Class A Common Stock Market Price\",\"content\":\"The recent trading price of our Class A common stock may reflect market dynamics that are unrelated to traditional software and business intelligence industry fundamentals. Our market capitalization currently significantly exceeds shareholders' equity calculated under U.S. GAAP and the valuation traditionally expected based on our operating performance, cash flows, and net assets. Investors may not be able to evaluate the value of our Class A common stock or assess our investment risk using traditional or commonly used corporate valuation methods.\"},\"notEtf\":{\"title\":\"We Are Not an ETF or ETP\",\"content\":\"We are not an exchange-traded product (ETP) or exchange-traded fund (ETF) registered under the Investment Company Act of 1940. Unlike spot Solana ETPs, we (i) do not seek to have our Class A common stock track the value of Solana held (before expenses and liabilities), (ii) do not benefit from various exemptions under the Securities Exchange Act of 1934 and other securities laws, (iii) are not a statutory trust operating under a trust agreement, (iv) are subject to corporate-level federal income taxes, and (v) are not required to provide daily transparency regarding Solana holdings or daily NAV.\"}},\"disclaimer\":\"Note: This information is provided for informational purposes only and should not be considered investment advice. Metrics are based on available data and are subject to change.\",\"metrics\":{\"price\":{\"label\":\"DFDV Price\",\"definition\":\"The current market price of DFDV stock\"},\"marketCap\":{\"label\":\"Market Cap\",\"definition\":\"The total market value of all outstanding common shares\"},\"solPrice\":{\"label\":\"SOL Price\",\"definition\":\"The current market price of SOL\"},\"solCount\":{\"label\":\"SOL Holdings (Total SOL)\",\"definit"])</script><script>self.__next_f.push([1,"ion\":\"Total SOL and SOL equivalents held by the company, including directly held SOL and dfdvSOL tokens (liquid staked SOL). SOL equivalents include SOL-based options and forward contracts.\"},\"solNav\":{\"label\":\"SOL NAV\",\"definition\":\"Net Asset Value representing the total market value of SOL and SOL equivalent holdings. This is the base value of the company's SOL assets before adjustments for debt or dilution. SOL equivalents include SOL-based options and forward contracts.\"},\"solPerShare\":{\"label\":\"SOL per Share\",\"definition\":\"The amount of SOL corresponding to each share of the company\"},\"solPerShareUsd\":{\"label\":\"SOL per Share (USD)\",\"definition\":\"The dollar value of SOL corresponding to each share of the company\"},\"spsGrowth\":{\"label\":\"SPS 3-Month Growth\",\"definition\":\"The growth rate of SOL per share over the past 90 days, including purchased SOL and staking rewards\"},\"marketValue\":{\"label\":\"Market Value ($M)\",\"definition\":\"The current market value of the bond (in millions)\"},\"mNav\":{\"label\":\"mNAV (Market Price to NAV Ratio)\",\"definition\":\"The ratio showing how many times the stock price trades above per-share NAV. A high mNAV indicates the market values the company at a premium relative to SOL holdings. A key valuation metric for SOL treasury companies.\"},\"threeMonthReturn\":{\"label\":\"3-Month Return\",\"definition\":\"The percentage change in DFDV stock price over the past 3 months\"},\"sixMonthReturn\":{\"label\":\"6-Month Return\",\"definition\":\"The percentage change in DFDV stock price over the past 6 months\"},\"oneYearReturn\":{\"label\":\"1-Year Return\",\"definition\":\"The percentage change in DFDV stock price over the past year\"},\"sseReturn\":{\"label\":\"SSE Return\",\"definition\":\"The DFDV stock price return since the Solana Standard Epoch (SSE) start date of April 4, 2025\"},\"impliedVolatility\":{\"label\":\"Implied Volatility\",\"definition\":\"The expected magnitude of DFDV stock price movement derived from ATM option prices. Calculated using options with strike prices within ±10% of the current price.\"},\"historicVolatility\":{\"label\":\"Historic Volatility\",\"definition\":\"The actual magnitude of DFDV stock price movement over the past 30 trading days, annualized to provide an annual volatility estimate\"},\"volume\":{\"label\":\"Trading Volume\",\"definition\":\"DFDV share trading volume from the previous complete trading day\"},\"avgVolume30d\":{\"label\":\"Avg. Trading Volume (30D)\",\"definition\":\"The average daily trading volume of DFDV shares over the past 30 days\"},\"debt\":{\"label\":\"Total Debt\",\"definition\":\"Total debt on the company's balance sheet including convertible notes. Used to determine net debt position and conversion scenarios in NAV calculations.\"},\"solGain2025\":{\"label\":\"SOL (Per Share) 2025 Gain\",\"definition\":\"A KPI representing the number of SOL held at the start of the current year multiplied by the SOL yield for that period. Per-share values are shown in parentheses.\"},\"solDollarGain2025\":{\"label\":\"SOL Dollar (Per Share) 2025 Gain\",\"definition\":\"A KPI representing the number of SOL held at the start of the current year multiplied by the SOL yield and then by the end-of-period SOL price. Per-share values are shown in parentheses.\"}}}},\"pageHeader\":{\"subscribeTitle\":\"Stay Updated\",\"subscribeDescription\":\"Get the latest news and updates from DeFi Development Corp.\"},\"investorPage\":{\"title\":\"Investor Relations\",\"tabs\":{\"overview\":\"Overview\",\"stockInformation\":\"Stock Information\",\"earnings\":\"Earnings\",\"mediaAndEvents\":\"Media \u0026 Events\",\"secFilings\":\"SEC Filings\",\"companyInformation\":\"Company Information\",\"corporateGovernance\":\"Corporate Governance\",\"leadershipGovernance\":\"Leadership \u0026 Governance\",\"contact\":\"Contact\"}}},\"now\":\"$undefined\",\"timeZone\":\"UTC\",\"children\":\"$L1f\"}]\n1f:[\"$\",\"$L2\",null,{\"parallelRouterKey\":\"children\",\"error\":\"$undefined\",\"errorStyles\":\"$undefined\",\"errorScripts\":\"$undefined\",\"template\":[\"$\",\"$L3\",null,{}],\"templateStyles\":\"$undefined\",\"templateScripts\":\"$undefined\",\"notFound\":[[[\"$\",\"title\",null,{\"children\":\"404: This page could not be found.\"}],[\"$\",\"div\",null,{\"style\":{\"fontFamily\":\"system-ui,\\\"Segoe UI\\\",Roboto,Helv"])</script><script>self.__next_f.push([1,"etica,Arial,sans-serif,\\\"Apple Color Emoji\\\",\\\"Segoe UI Emoji\\\"\",\"height\":\"100vh\",\"textAlign\":\"center\",\"display\":\"flex\",\"flexDirection\":\"column\",
