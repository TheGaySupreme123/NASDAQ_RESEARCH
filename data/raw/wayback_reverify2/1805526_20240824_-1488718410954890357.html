ed international business management advisory firm he founded in 1997 in Boca Raton, Florida, specializing in real estate, energy, utilities, infrastructure, financial services, oil and gas and cyber and secure technology. Ambassador Siegel has served since 2013 as Of Counsel to the law firm of Wildes \u0026 Weinberg, P.C. From October 2007 until January 2009, he served as the United States Ambassador to the Commonwealth of The Bahamas. Prior to his Ambassadorship, in 2006, he served with Ambassador John R. Bolton at the United Nations in New York, as the Senior Advisor to the U.S. Mission and as the United States Representative to the 61st Session of the United Nations General Assembly. From 2003 to 2007, Ambassador Siegel served on the Board of Directors of the Overseas Private Investment Corporation (“OPIC”), which was established to help U.S. businesses invest overseas, fostering economic development in new and emerging markets, complementing the private sector in managing the risk associated with foreign direct investment and supporting U.S. foreign policy. Appointed by Governor Jeb Bush, Ambassador Siegel served as a Member of the Board of Directors of Enterprise Florida, Inc. (“EFI”) from 1999-2004. EFI is the State of Florida’s primary organization promoting statewide economic development through its public-private partnership. Ambassador Siegel presently serves on the Board of Directors of Worksport, Ltd. (Nasdaq: WKSP) and Bannix Acquisition Corp. (Nasdaq: BNIX). He also presently serves on the following Advisory Boards: U.S. Medical Glove Company, Captis Intelligence, Inc. and Maridose, LLC."])</script><script>self.__next_f.push([1,"9:[[[\"$\",\"section\",null,{\"className\":\"relative space-y-6 py-8 md:py-12 lg:pb-24\",\"children\":[\"$\",\"div\",null,{\"className\":\"container flex max-w-[64rem] flex-col items-center gap-5 text-center\",\"children\":[[\"$\",\"img\",null,{\"src\":\"/static/jnvr_back.jpeg\",\"alt\":\"Governance\",\"className\":\"absolute
